function TeamLogo(props) {
  var team=props.team, size=props.size||56, glow=props.glow||null;
  var src=TEAM_LOGOS[team]||"";
  return React.createElement("img",{
    src:src, alt:team||"", width:size, height:size,
    style:{objectFit:"contain",flexShrink:0,
      filter:glow?"drop-shadow(0 0 "+Math.round(size*0.14)+"px "+glow+"60)":"none"}
  });
}

function bestPrices(oddsData,hteam,ateam){
  if(!oddsData||!oddsData.length)return null;
  var game=oddsData.find(function(g){
    var hn=g.home_team||"",an=g.away_team||"";
    return (hn.indexOf(hteam.split(" ")[0])>=0||hteam.indexOf(hn.split(" ")[0])>=0)&&
           (an.indexOf(ateam.split(" ")[0])>=0||ateam.indexOf(an.split(" ")[0])>=0);
  });
  if(!game)return null;
  var bestHome=null,bestAway=null,bestOver=null,bestUnder=null,ouLine=null;
  (game.bookmakers||[]).forEach(function(bk){
    (bk.markets||[]).forEach(function(mkt){
      if(mkt.key==="h2h")(mkt.outcomes||[]).forEach(function(o){
        if(o.name===game.home_team&&(!bestHome||o.price>bestHome))bestHome=o.price;
        if(o.name===game.away_team&&(!bestAway||o.price>bestAway))bestAway=o.price;
      });
      if(mkt.key==="totals")(mkt.outcomes||[]).forEach(function(o){
        if(!ouLine&&o.point)ouLine=o.point;
        if(o.name==="Over"&&(!bestOver||o.price>bestOver))bestOver=o.price;
        if(o.name==="Under"&&(!bestUnder||o.price>bestUnder))bestUnder=o.price;
      });
    });
  });
  return {bestHome:bestHome,bestAway:bestAway,bestOver:bestOver,bestUnder:bestUnder,ouLine:ouLine};
}

/* ── calcRollingSC ── */
function calcRollingSC(games){
  var byTeam={};
  games.slice().sort(function(a,b){return a.round-b.round;}).forEach(function(g){
    if(g.complete!==100||g.hscore==null)return;
    [[g.hteam,g.hscore,g.ascore],[g.ateam,g.ascore,g.hscore]].forEach(function(row){
      if(!byTeam[row[0]])byTeam[row[0]]=[];
      byTeam[row[0]].push({round:g.round,pf:row[1],pa:row[2]});
    });
  });
  var sc={};
  Object.keys(byTeam).forEach(function(team){
    var gs=byTeam[team].slice(-8);
    if(!gs.length)return;
    var rec=gs.slice(-3);
    var rPF=rec.reduce(function(s,g){return s+g.pf;},0)/rec.length;
    var rPA=rec.reduce(function(s,g){return s+g.pa;},0)/rec.length;
    var aPF=gs.reduce(function(s,g){return s+g.pf;},0)/gs.length;
    var aPA=gs.reduce(function(s,g){return s+g.pa;},0)/gs.length;
    sc[team]={pf:Math.round(rPF*0.6+aPF*0.4),pa:Math.round(rPA*0.6+aPA*0.4)};
  });
  return sc;
}

/* ── injAdj ── */
function injAdj(team,ins,outs){
  var pf=0,pa=0;
  (outs||[]).forEach(function(o){
    var name=o.split(" (")[0].trim();
    if(PI[name]&&PI[name].team===team){pf-=PI[name].pf;pa-=PI[name].pa;}
    if(RUCK_QUALITY[name])pf-=Math.min(4,(RUCK_QUALITY[name]-5.5)*0.6);
  });
  return {pf:pf,pa:pa};
}

/* ── nightDewAdj ── */
function nightDewAdj(venue,dateStr){
  if(!dateStr)return 0;
  var h=new Date(dateStr).getUTCHours()+10;
  if(h>=24)h-=24;
  if(h<18)return 0;
  var open=["MCG","Gabba","SCG","Optus","Adelaide","UTAS","Blundstone","GMHBA","Kardinia","TIO","Darwin"];
  if(!open.some(function(v){return (venue||"").indexOf(v.split(" ")[0])>=0;}))return 0;
  var month=new Date(dateStr).getUTCMonth();
  return (month>=4&&month<=8)?-5:-4;
}

/* ── lowScoringPenalty ── */
function lowScoringPenalty(h,a,sc){
  var hs=sc[h]||SEASON_BASE[h],as_=sc[a]||SEASON_BASE[a];
  if(!hs||!as_)return 0;
  var avg=(hs.pf+as_.pf)/2;
  return avg>=90?0:Math.round(Math.max(-8,(avg-90)*0.4));
}

/* ── travelPenalty ── */
function travelPenalty(venue,hteam,ateam){
  var PT=["West Coast","Fremantle"],PV=["Optus Stadium","Domain Stadium","Subiaco"],DV=["TIO","Darwin","Marrara"];
  if(PV.some(function(v){return (venue||"").indexOf(v.split(" ")[0])>=0;})&&PT.indexOf(ateam)<0)return [0,-4];
  if(DV.some(function(v){return (venue||"").indexOf(v)>=0;}))return [2,2];
  return [0,0];
}

/* ── getRuckRating ── */
function getRuckRating(team,outs){
  var penalty=0;
  (outs||[]).map(function(o){return o.split(" (")[0].trim();}).forEach(function(name){
    if(RUCK_QUALITY[name])penalty+=(RUCK_QUALITY[name]-5.5)*0.8;
  });
  return -Math.min(6,penalty);
}

/* ── projTotal ── */
function projTotal(hteam,ateam,venue,weatherAdj,hIns,hOuts,aIns,aOuts,sc,dateStr){
  var s=sc||SEASON_BASE;
  var hs=s[hteam]||SEASON_BASE[hteam],asc=s[ateam]||SEASON_BASE[ateam];
  if(!hs||!asc)return null;
  var vf=VF[venue]||0,dewA=nightDewAdj(venue,dateStr||null),botA=lowScoringPenalty(hteam,ateam,s);
  var hi=injAdj(hteam,hIns||[],hOuts||[]),ai=injAdj(ateam,aIns||[],aOuts||[]);
  var hpf=Math.max(40,hs.pf+hi.pf),hpa=Math.max(40,hs.pa+hi.pa);
  var apf=Math.max(40,asc.pf+ai.pf),apa=Math.max(40,asc.pa+ai.pa);
  var trav=travelPenalty(venue,hteam,ateam);
  var hScore=hpf+getRuckRating(hteam,hOuts||[])+trav[0];
  var aScore=apf+getRuckRating(ateam,aOuts||[])+trav[1];
  return +((hScore+apa+aScore+hpa)/2+vf+(weatherAdj||0)+dewA+botA).toFixed(1);
}

/* ── adjProb ── */
function adjProb(hteam,ateam,base){
  var p=+base;
  if(hteam==="Port Adelaide"&&p>=55&&p<75)p=Math.max(15,p-8);
  if(hteam==="Hawthorn"&&p>=40&&p<70)p=Math.min(85,p+5);
  if(ateam==="Hawthorn"){var a=100-p;if(a>=40&&a<=70)p=Math.max(p-5,25);}
  if(ateam==="Fremantle"&&p<55)p=Math.max(15,p-3);
  if(hteam==="Melbourne"&&p>45&&p<65)p=Math.min(78,p+3);
  if((hteam==="Essendon"||ateam==="Essendon")&&p>60)p=Math.max(50,p-3);
  return Math.min(85,Math.max(15,Math.round(p)));
}

/* ── Form / Clutch / Efficiency ── */
function calcClutchScore(team,allGames){
  var done=allGames.filter(function(g){return (g.hteam===team||g.ateam===team)&&g.complete===100&&g.margin!=null;});
  if(done.length<4)return 0;
  var wins=done.filter(function(g){return g.winner===team;}).length;
  var or_=wins/done.length;
  var close=done.filter(function(g){return Math.abs(g.margin||0)<=12;});
  if(close.length<2)return 0;
  return Math.round((close.filter(function(g){return g.winner===team;}).length/close.length-or_)*100);
}

function calcStreak(team,allGames){
