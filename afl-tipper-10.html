/* ── Algorithm functions ───────────────────────────────────────────── */
/* Improvement #1 — Rolling weighted SC from Squiggle results */
const calcRollingSC = (games) => {
  const byTeam = {};
  [...games].sort((a,b) => a.round - b.round).forEach(g => {
    if (g.complete < 100 || !g.hscore || !g.ascore) return;
    const h = sqN(g.hteam), a = sqN(g.ateam);
    if (!byTeam[h]) byTeam[h] = [];
    if (!byTeam[a]) byTeam[a] = [];
    byTeam[h].push({pf:g.hscore,pa:g.ascore});
    byTeam[a].push({pf:g.ascore,pa:g.hscore});
  });
  const sc = {};
  Object.keys(SEASON_BASE).forEach(team => {
    const {pf:spf,pa:spa} = SEASON_BASE[team];
    const hist = (byTeam[team]||[]).slice(-5);
    if (hist.length >= 2) {
      const rpf = hist.reduce((s,g)=>s+g.pf,0)/hist.length;
      const rpa = hist.reduce((s,g)=>s+g.pa,0)/hist.length;
      sc[team] = {pf:+(rpf*.6+spf*.4).toFixed(1), pa:+(rpa*.6+spa*.4).toFixed(1), n:hist.length};
    } else {
      sc[team] = {...SEASON_BASE[team], n:0};
    }
  });
  return sc;
};

const injAdj = (team, ins=[], outs=[]) => {
  let pf=0,pa=0;
  (ins||[]).forEach(r => { const n=r.split(' (')[0]; const p=PI[n]; if(p&&p.team===team){pf+=p.pf;pa+=p.pa;} });
  (outs||[]).forEach(r => { const n=r.split(' (')[0]; const p=PI[n]; if(p&&p.team===team){pf-=p.pf;pa-=p.pa;} });
  return {pf,pa};
};

const projTotal = (hteam, ateam, venue, weatherAdj=0, hIns=[], hOuts=[], aIns=[], aOuts=[], sc=SEASON_BASE) => {
  const hs=sc[hteam]||SEASON_BASE[hteam], as=sc[ateam]||SEASON_BASE[ateam];
  if (!hs||!as) return null;
  const vf = VF[venue]||0;
  const hi = injAdj(hteam,hIns,hOuts), ai = injAdj(ateam,aIns,aOuts);
  const hpf=Math.max(40,hs.pf+hi.pf), hpa=Math.max(40,hs.pa+hi.pa);
  const apf=Math.max(40,as.pf+ai.pf), apa=Math.max(40,as.pa+ai.pa);
  return +((hpf+apa+apf+hpa)/2+vf+weatherAdj).toFixed(1);
};

/* Improvement #2 — Port clutch penalty | Improvement #8 — Hawthorn efficiency bonus */
const adjProb = (hteam, ateam, base) => {
  let p = +base;
  if (hteam==="Port Adelaide"&&p>=55&&p<=75) p=Math.max(p-8,50);
  if (ateam==="Port Adelaide") { const a=100-p; if(a>=55&&a<=75) p=Math.min(p+8,50); }
  if (hteam==="Hawthorn"&&p>=40&&p<=70) p=Math.min(p+5,75);
  if (ateam==="Hawthorn") { const a=100-p; if(a>=40&&a<=70) p=Math.max(p-5,25); }
  return Math.round(p);
};

/* ── Squiggle API ──────────────────────────────────────────────────── */
const SQ_BASE = 'https://api.squiggle.com.au/';
// Squiggle fetch — works from HTTPS origins (GitHub Pages, Netlify etc.)
// Falls back gracefully to STATIC_GAMES if unavailable
const sqFetch = async q => {
  const url = SQ_BASE + '?' + q;
  try {
    const r = await fetch(url, {
      method: 'GET',
      headers: {'Accept': 'application/json'},
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    return data;
  } catch(e) {
    // Try without custom headers (avoids CORS preflight on some configs)
    try {
      const r2 = await fetch(url);
      if (!r2.ok) throw new Error('HTTP ' + r2.status);
      return r2.json();
    } catch(e2) {
      const isHttps = location.protocol === 'https:';
      throw new Error(isHttps
        ? 'Squiggle unreachable — ' + e2.message
        : 'Squiggle needs HTTPS hosting (GitHub Pages / Netlify)');
    }
  }
};
const fetchSquiggleGames = async (year=2026) => {
  const d = await sqFetch(`q=games;year=${year}`);
  return (d.games||[]).map(g=>({...g, hteam:sqN(g.hteam), ateam:sqN(g.ateam)}));
};
const fetchSquiggleTips = async (year=2026, round) => {
  const d = await sqFetch(`q=tips;year=${year};round=${round};source=squiggle`);
  return (d.tips||[]).map(t=>({...t, hteam:sqN(t.hteam), ateam:sqN(t.ateam), tip:sqN(t.tip||'')}));
};

/* ── The Odds API ──────────────────────────────────────────────────── */
const fetchOddsAPI = async (apiKey) => {
  // TAB bookmaker key in The Odds API is "tab" for Australian market
  const url = `https://api.the-odds-api.com/v4/sports/aussierules_afl/odds/?apiKey=${apiKey}&regions=au&markets=h2h,totals&oddsFormat=decimal&bookmakers=tab`;
  const r = await fetch(url);
  if (!r.ok) {
    if (r.status===401||r.status===403) throw new Error('Invalid API key — check at the-odds-api.com');
    throw new Error('Odds API '+r.status);
  }
  const games = await r.json();
  const out = {};
  games.forEach(g => {
    const h=oqN(g.home_team), a=oqN(g.away_team);
    const bk = {};
    g.bookmakers.forEach(b => {
      const h2h = b.markets.find(m=>m.key==='h2h');
      const tot = b.markets.find(m=>m.key==='totals');
      if (h2h||tot) {
        bk[b.key] = {label:b.title.replace(/ AU$/,'').replace(/ Australia$/,'')};
        if (h2h) {
          const ho = h2h.outcomes.find(o=>oqN(o.name)===h);
          const ao = h2h.outcomes.find(o=>oqN(o.name)===a);
          bk[b.key].h2h = {home:ho?.price, away:ao?.price};
        }
        if (tot) {
          const ov = tot.outcomes.find(o=>o.name==='Over');
          const un = tot.outcomes.find(o=>o.name==='Under');
          bk[b.key].totals = {line:ov?.point, over:ov?.price, under:un?.price};
        }
      }
    });
    out[h+'__'+a] = {bookmakers:bk};
  });
  return out;
};

const getOdds = (data, h, a) => data ? (data[h+'__'+a] || data[a+'__'+h] || null) : null;

// Find TAB bookmaker entry — key is "tab" in The Odds API Australian market
const getTabBk = (bkObj) => {
  const entries = Object.entries(bkObj||{});
  // Try exact key match first, then label match
  const tab = entries.find(([k,b]) => k==="tab" || b.label?.toLowerCase().includes("tab"));
  return tab ? tab[1] : null;
};

const bestPrices = (data, h, a) => {
  const g = getOdds(data,h,a);
  if (!g) return null;
  const tab = getTabBk(g.bookmakers);
  if (!tab) return null; // Only use TAB data
  return {
    bestHome:  tab.h2h?.home    || null,
    bestAway:  tab.h2h?.away    || null,
    ouLine:    tab.totals?.line || null,
    bestOver:  tab.totals?.over  || null,
    bestUnder: tab.totals?.under || null,
    bookmakers: g.bookmakers,
    tabOnly: true,
  };
};

  const bks = g ? Object.entries(g.bookmakers||{}) : [];

/* ── Game Card ─────────────────────────────────────────────────────── */
const GameCard = ({game, round, sc, oddsData, sqTip}) => {
  const {hteam,ateam,venue,date,complete,hscore,ascore,winner,margin} = game;
  const key = mk(hteam,ateam);
  const rd = MANUAL_DATA[round] || {};
  const wx = (rd.weather||{})[key] || {adj:0,desc:"—"};
  const hSq = (rd.squads||{})[hteam] || {ins:[],outs:[],key:[]};
  const aSq = (rd.squads||{})[ateam] || {ins:[],outs:[],key:[]};
  const ana = (rd.analysis||{})[key] || null;
  const vRec = (rd.venueRecord||{})[key] || "";

  // Win probability: Squiggle → Odds API implied → base 50
  const bp = bestPrices(oddsData,hteam,ateam);
  let hProb = 50;
  if (sqTip) hProb = Math.round(sqTip.hconfidence||50);
  else if (bp?.bestHome && bp?.bestAway) {
    const p=1/bp.bestHome, q=1/bp.bestAway;
    hProb = Math.round(p/(p+q)*100);
  }
  const adjH = adjProb(hteam,ateam,hProb);
  const adjA = 100-adjH;
  const favP = Math.max(adjH,adjA);
  const confStr = favP>=80?"CLEAR":favP>=65?"MOD":"CLOSE";
  const confCol = confStr==="CLEAR"?"#CAFF00":confStr==="MOD"?"#FFC300":"#3D5878";

  // O/U: live line from Odds API, else fallback
  const ouLine = bp?.ouLine || null;
  const p = projTotal(hteam,ateam,venue,wx.adj,hSq.ins,hSq.outs,aSq.ins,aSq.outs,sc);
  const ouTip = p&&ouLine ? (p>ouLine?"OVER":"UNDER") : null;
  const ouCol = ouTip==="OVER"?"#FFC300":"#00E5FF";
  const gap = p&&ouLine ? (p-ouLine).toFixed(1) : null;
  const ouConfStr = gap?Math.abs(+gap)>=15?"HIGH":Math.abs(+gap)>=8?"MOD":"SLIM":null;
  const ouConfCol = ouConfStr==="HIGH"?"#CAFF00":ouConfStr==="MOD"?"#FFC300":"#3D5878";

  const hs = sc[hteam]||SEASON_BASE[hteam];
  const as = sc[ateam]||SEASON_BASE[ateam];
  const hi = injAdj(hteam,hSq.ins,hSq.outs);
  const ai = injAdj(ateam,aSq.ins,aSq.outs);
  const vf = VF[venue]||0;
  const done = complete===100;

  const hcol = TC[hteam]||"#334155";
  const acol = TC[ateam]||"#334155";
  return(<div style={{background:"#0C1525",border:`1px solid ${hcol}40`,borderRadius:16,marginBottom:16,overflow:"hidden",boxShadow:`0 4px 24px ${hcol}15`}}>
    {/* Header bar — team colour gradient */}
    <div style={{background:`linear-gradient(90deg,${hcol}30 0%,${hcol}08 40%,${acol}08 60%,${acol}30 100%)`,borderBottom:`1px solid #1C2D48`,padding:"8px 16px",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
      <span style={{...M,fontSize:10,color:"#3D5878",letterSpacing:"0.06em"}}>{date}</span>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{...S,fontSize:10,color:"#3D5878"}}>{venue}</span>
        {done && <Pill label="FULL TIME" col="#7A96BA"/>}
      </div>
    </div>
    {/* Teams */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 44px 1fr",padding:"14px 14px 4px"}}>
      {[{t:hteam,s:hs,inj:hi,score:done?hscore:null,won:done&&winner===hteam},
        {t:ateam,s:as,inj:ai,score:done?ascore:null,won:done&&winner===ateam}].reduce((acc,{t,s,inj,score,won},idx) => {
        const col = TC[t]||"#1C2D48";
        const el = (<div key={t} style={{textAlign:"center"}}>
          <div style={{display:"inline-block",background:col+"28",border:`1px solid ${col}50`,borderRadius:5,padding:"1px 7px",marginBottom:5}}>
            <span style={{...M,fontSize:9,color:"#7A96BA",letterSpacing:"0.1em"}}>{idx===0?"HOME":"AWAY"}</span>
          </div>
          <div style={{...BD,fontSize:32,lineHeight:1,letterSpacing:"0.04em",color:won?"#CAFF00":done?"#3D5878":"#EAF0FF",textShadow:won?"0 0 20px #CAFF0060":"none"}}>{ABBR[t]||t}</div>
          <div style={{...S,fontSize:10,color:"#3D5878",marginTop:1}}>{t}</div>
          {score!=null && <div style={{...BD,fontSize:52,lineHeight:1,color:won?"#CAFF00":"#3D5878",marginTop:4,textShadow:won?"0 0 30px #CAFF0050":"none"}}>{score}</div>}
          {s && !done && <div style={{display:"flex",justifyContent:"center",gap:10,marginTop:6}}>
            <span style={{...M,fontSize:10,color:"#00FF9D",background:"#00FF9D15",padding:"2px 8px",borderRadius:20,border:"1px solid #00FF9D30"}}>▲{+(s.pf+inj.pf).toFixed(1)}</span>
            <span style={{...M,fontSize:10,color:"#FF3D3D",background:"#FF3D3D15",padding:"2px 8px",borderRadius:20,border:"1px solid #FF3D3D30"}}>▼{+(s.pa+inj.pa).toFixed(1)}</span>
          </div>}
        </div>);
        if (idx===0) return [...acc,el,
          <div key="vs" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3}}>
            <span style={{...M,fontSize:12,color:"#3D5878",fontWeight:700}}>VS</span>
            {done&&margin!=null&&<span style={{...M,fontSize:10,color:"#3D5878"}}>+{margin}</span>}
          </div>];
        return [...acc,el];
      },[])}
    </div>
    {!done && <div style={{...S,padding:"2px 14px 6px",textAlign:"center",fontSize:9,color:"#3D5878"}}>▲ adj score  ▼ adj concede — rolling weighted avg{hs?.n?` (${hs.n}g)`:""}</div>}
    {/* Prob bar */}
    {!done && <div style={{padding:"6px 16px 8px"}}>
      <div style={{display:"flex",height:8,borderRadius:4,overflow:"hidden",border:"1px solid #1C2D48",boxShadow:"inset 0 1px 4px #00000060"}}>
        <div style={{width:adjH+"%",background:TC[hteam]||"#334155",boxShadow:`2px 0 12px ${TC[hteam]||"#334155"}80`,transition:"width .6s ease"}}/>
        <div style={{flex:1,background:TC[ateam]||"#334155",boxShadow:`-2px 0 12px ${TC[ateam]||"#334155"}80`}}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>
        <span style={{...M,fontSize:11,fontWeight:700,color:"#EAF0FF"}}>{adjH}<span style={{fontSize:9,color:"#3D5878"}}>%</span></span>
        <span style={{...M,fontSize:8,color:"#3D5878",letterSpacing:"0.12em"}}>ADJ WIN PROBABILITY</span>
        <span style={{...M,fontSize:11,fontWeight:700,color:"#EAF0FF"}}>{adjA}<span style={{fontSize:9,color:"#3D5878"}}>%</span></span>
      </div>
    </div>}
    {/* Quick info */}
    {!done && <div style={{padding:"6px 14px 8px",display:"flex",gap:6,borderTop:"1px solid #1C2D48",flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:5,background:"#080D1A",border:"1px solid #1C2D48",borderRadius:7,padding:"5px 10px",flex:1}}>
        <span style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.05em"}}>CONF</span>
        <span style={{...M,fontSize:11,color:confCol,fontWeight:700,marginLeft:4}}>{confStr}</span>
        {sqTip&&<span style={{...M,fontSize:8,color:"#3D5878",marginLeft:"auto"}}>via squiggle</span>}
        {bp&&!sqTip&&<span style={{...M,fontSize:8,color:"#3D5878",marginLeft:"auto"}}>via odds</span>}
      </div>
      {ouLine&&p&&<div style={{display:"flex",alignItems:"center",gap:5,background:"#080D1A",border:"1px solid #1C2D48",borderRadius:7,padding:"5px 10px",flex:2}}>
        <span style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.05em"}}>O/U</span>
        <span style={{...M,fontSize:12,fontWeight:700,color:"#EAF0FF",marginLeft:4}}>{ouLine}</span>
        <span style={{...M,fontSize:11,fontWeight:700,color:ouCol,marginLeft:4,background:ouCol+"18",border:`1px solid ${ouCol}40`,padding:"1px 6px",borderRadius:6}}>{ouTip}</span>
        <span style={{...M,fontSize:9,color:"#3D5878",marginLeft:3}}>proj {p}</span>
        {ouConfStr&&<Pill label={ouConfStr} col={ouConfCol}/>}
      </div>}
    </div>}
    {/* Tip + analysis */}
    <Acc label="⚡ MATCH TIP + O/U ANALYSIS" color="#CAFF00">
      {ana ? (<>
        <p style={{...S,fontSize:12,color:"#7A96BA",lineHeight:1.7,marginBottom:8}}>{ana.text}</p>
        {ana.tip&&!done&&<div style={{marginBottom:10,padding:"12px 16px",borderRadius:12,background:"linear-gradient(135deg,#CAFF0018,#80FF0010)",border:"1px solid #CAFF0050",boxShadow:"0 0 20px #CAFF0020",display:"flex",alignItems:"center",gap:10}}>
          <span style={{...BD,fontSize:28,color:"#CAFF00",textShadow:"0 0 20px #CAFF0080",letterSpacing:"0.06em"}}>✓ {ana.tip.toUpperCase()}</span>
        </div>}
        {p&&<div style={{padding:"10px 12px",borderRadius:7,background:"#080D1A",border:"1px solid #1C2D48",marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <div>
              <div style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.06em",marginBottom:3}}>O/U {ouLine||"—"} · ALGORITHM</div>
              {ouTip&&<div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{...M,fontSize:14,fontWeight:700,color:ouCol}}>{ouTip} {ouLine}</span>
                {ouConfStr&&<Pill label={ouConfStr} col={ouConfCol}/>}
              </div>}
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{...M,fontSize:9,color:"#3D5878"}}>PROJECTED</div>
              <div style={{...M,fontSize:18,fontWeight:700,color:gap&&+gap>0?"#FFC300":"#00E5FF"}}>{p}</div>
              {gap&&<div style={{...M,fontSize:9,color:"#3D5878"}}>{+gap>=0?"+":""}{gap} vs line</div>}
            </div>
          </div>
          <div style={{...S,fontSize:10,color:"#3D5878"}}>
            Rolling SC{vf!==0?` ${vf>0?"+":""}${vf} ${venue.split(',')[0].split(' ').slice(-1)[0]} venue`:""}{wx.adj!==0?` ${wx.adj} weather`:""}
            {hi.pf!==0||hi.pa!==0?` | ${hteam.split(' ').slice(-1)[0]} inj adj (pf${hi.pf>=0?"+":""}${hi.pf} pa${hi.pa>=0?"+":""}${hi.pa})`:""}
            {ai.pf!==0||ai.pa!==0?` | ${ateam.split(' ').slice(-1)[0]} inj adj (pf${ai.pf>=0?"+":""}${ai.pf} pa${ai.pa>=0?"+":""}${ai.pa})`:""}
          </div>
        </div>}
        {(()=>{
          // Auto-generate the double from algorithm tip + O/U call
          const tipTeam  = ana?.tip;
          const isHome   = tipTeam === hteam;
          const tipOdds  = tipTeam ? (isHome ? bp?.bestHome : bp?.bestAway) : null;
          const ouOdds   = ouTip==="OVER" ? bp?.bestOver : bp?.bestUnder;
          const combined = tipOdds && ouOdds ? (tipOdds * ouOdds).toFixed(2) : null;

          if (!tipTeam || !ouTip || !ouLine || done) return null;

          // Two legs: team to win + O/U direction
          const legs = [
            {label:`${tipTeam} to win`, odds:tipOdds?`$${tipOdds.toFixed(2)}`:null},
            {label:`${ouTip} ${ouLine}`, odds:ouOdds?`$${ouOdds.toFixed(2)}`:null},
          ];
          return(<div style={{padding:"12px 14px",borderRadius:12,background:"linear-gradient(135deg,#CAFF0010,#080D1A)",border:"1px solid #CAFF0040",marginBottom:10,boxShadow:"0 0 16px #CAFF0015"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div style={{...BD,fontSize:18,color:"#CAFF00",letterSpacing:"0.12em",textShadow:"0 0 12px #CAFF0060"}}>★ TAB H2H O/U DOUBLE</div>
              {combined&&<div style={{textAlign:"right"}}>
                <div style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.06em"}}>COMBINED PRICE</div>
                <div style={{...BD,fontSize:22,color:"#CAFF00",textShadow:"0 0 16px #CAFF0060"}}>${combined}</div>
              </div>}
            </div>
            {/* Leg 1: H2H tip */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",borderRadius:8,marginBottom:6,background:"#CAFF0012",border:"1px solid #CAFF0040"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{...M,fontSize:9,color:"#CAFF00",background:"#CAFF0020",padding:"1px 7px",borderRadius:20,letterSpacing:"0.08em"}}>H2H</span>
                <span style={{...S,fontSize:13,color:"#EAF0FF",fontWeight:600}}>{legs[0].label}</span>
              </div>
              {legs[0].odds
                ?<span style={{...BD,fontSize:24,color:"#CAFF00",textShadow:"0 0 12px #CAFF0050"}}>{legs[0].odds}</span>
                :<span style={{...M,fontSize:10,color:"#3D5878"}}>add TAB key</span>}
            </div>
            {/* Leg 2: O/U tip */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",borderRadius:8,background:"#CAFF0012",border:"1px solid #CAFF0040"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{...M,fontSize:9,color:"#FFC300",background:"#FFC30020",padding:"1px 7px",borderRadius:20,letterSpacing:"0.08em"}}>O/U</span>
                <span style={{...S,fontSize:13,color:"#EAF0FF",fontWeight:600}}>{legs[1].label}</span>
              </div>
              {legs[1].odds
                ?<span style={{...BD,fontSize:24,color:"#FFC300",textShadow:"0 0 12px #FFC30050"}}>{legs[1].odds}</span>
                :<span style={{...M,fontSize:10,color:"#3D5878"}}>add TAB key</span>}
            </div>
            {!bp&&<div style={{...M,fontSize:9,color:"#3D5878",marginTop:4,textAlign:"center",letterSpacing:"0.06em"}}>ADD ODDS API KEY IN SETTINGS FOR LIVE PRICES</div>}
          </div>);
        })()}
        <OddsPanel h={hteam} a={ateam} oddsData={oddsData}/>
      </>) : (<div style={{...S,color:"#3D5878",fontSize:12,paddingBottom:4}}>
        Analysis for this round not yet loaded. Update via Claude chat.
        <OddsPanel h={hteam} a={ateam} oddsData={oddsData}/>
      </div>)}
    </Acc>
    {/* Squad news */}
    <Acc label="👥 SQUAD NEWS" color="#FF2D78">
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:4}}>
        {[[hteam,hSq],[ateam,aSq]].map(([t,sq])=>(
          <div key={t}>
            <div style={{...M,fontSize:10,fontWeight:700,color:TC[t]||"#7A96BA",letterSpacing:"0.08em",marginBottom:5}}>{ABBR[t]||t}</div>
            {sq.ins?.length>0&&<div style={{marginBottom:5}}><div style={{...M,fontSize:9,color:"#00FF9D",marginBottom:2}}>▲ IN</div>{sq.ins.map((x,i)=><div key={i} style={{...S,fontSize:11,color:"#B0FFF0",lineHeight:1.5}}>· {x}</div>)}</div>}
            {sq.outs?.length>0&&<div style={{marginBottom:5}}><div style={{...M,fontSize:9,color:"#FF3D3D",marginBottom:2}}>▼ OUT</div>{sq.outs.map((x,i)=><div key={i} style={{...S,fontSize:11,color:"#FFB0A0",lineHeight:1.5}}>· {x}</div>)}</div>}
            {sq.key?.length>0&&<div><div style={{...M,fontSize:9,color:"#FFC300",marginBottom:2}}>★ KEY</div>{sq.key.map((x,i)=><div key={i} style={{...S,fontSize:11,color:"#FFE580",lineHeight:1.5}}>· {x}</div>)}</div>}
            {!sq.ins?.length&&!sq.outs?.length&&!sq.key?.length&&<div style={{...S,fontSize:11,color:"#3D5878"}}>Not yet available — update via Claude</div>}
          </div>
        ))}
      </div>
    </Acc>
    {/* Match intel */}
    <Acc label="📍 MATCH INTEL" color="#00CFFF">
      <div style={{display:"flex",flexDirection:"column",gap:7,marginTop:4}}>
        {wx.desc!=="—"&&<div style={{padding:"7px 10px",background:"#080D1A",borderRadius:6,border:"1px solid #1C2D48"}}>
          <div style={{...M,fontSize:9,color:"#00CFFF",letterSpacing:"0.08em",marginBottom:3}}>🌤 WEATHER</div>
          <p style={{...S,fontSize:11,color:"#7A96BA"}}>{wx.desc}</p>
        </div>}
        {vRec&&<div style={{padding:"7px 10px",background:"#080D1A",borderRadius:6,border:"1px solid #1C2D48"}}>
          <div style={{...M,fontSize:9,color:"#00CFFF",letterSpacing:"0.08em",marginBottom:3}}>🏟 VENUE RECORD</div>
          <p style={{...S,fontSize:11,color:"#7A96BA"}}>{vRec}</p>
        </div>}
        {vf!==0&&<div style={{padding:"7px 10px",background:"#080D1A",borderRadius:6,border:"1px solid #FFC30030"}}>
          <div style={{...M,fontSize:9,color:"#FFC300",letterSpacing:"0.08em",marginBottom:3}}>📊 VENUE SCORING FACTOR</div>
          <p style={{...S,fontSize:11,color:"#7A96BA"}}>{venue}: {vf>0?"+":""}{vf} pts applied to O/U projection</p>
        </div>}
      </div>
    </Acc>
  </div>);
};

/* ── Retro Round Card — extracted so useState is valid ─────────────── */
const RetroRoundCard = ({r, allGames, sc, currentRound}) => {
  const rGames  = allGames.filter(g=>g.round===r).sort((a,b)=>a.date<b.date?-1:1);
  const done    = rGames.filter(g=>g.complete===100);
  const rAna    = MANUAL_DATA[r]?.analysis||{};
  const rLines  = MANUAL_DATA[r]?.ouLines||{};

  // H2H accuracy
  const tipped  = done.filter(g=>{ const tip=rAna[mk(g.hteam,g.ateam)]?.tip; return tip&&tip===g.winner; }).length;
  const h2hPct  = done.length>0 ? Math.round(tipped/done.length*100) : null;
  const h2hCol  = h2hPct==null?"#3D5878":h2hPct>=80?"#CAFF00":h2hPct>=65?"#FFC300":"#FF3D3D";

  // Double accuracy (H2H tip correct AND O/U correct)
  let dblT=0, dblC=0;
  done.forEach(g=>{
    const key    = mk(g.hteam,g.ateam);
    const h2hTip = rAna[key]?.tip;
    const line   = rLines[key];
    if(!h2hTip||!line) return;
    const p      = projTotal(g.hteam,g.ateam,g.venue||"",0,[],[],[],[],sc);
    const ouTip  = p>line?"OVER":"UNDER";
    const ouAct  = (g.hscore+g.ascore)>line?"OVER":"UNDER";
    dblT++;
    if(h2hTip===g.winner && ouTip===ouAct) dblC++;
  });
  const dblPct  = dblT>0 ? Math.round(dblC/dblT*100) : null;
  const dblCol  = dblPct==null?"#3D5878":dblPct>=60?"#CAFF00":dblPct>=40?"#FFC300":"#FF3D3D";

  const borderCol = h2hCol;
  const [open,setOpen] = useState(r===currentRound);

  return(<div style={{background:"#0C1525",border:`1px solid ${borderCol}30`,borderRadius:14,marginBottom:10,overflow:"hidden",boxShadow:`0 2px 16px ${borderCol}08`}}>
    <button onClick={()=>setOpen(x=>!x)} style={{width:"100%",padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,background:open?borderCol+"08":"transparent",transition:"background .2s"}}>
      {/* Left: round label + game count */}
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{...BD,fontSize:26,color:h2hPct!=null?h2hCol:"#EAF0FF",letterSpacing:"0.08em",textShadow:h2hPct!=null&&open?`0 0 16px ${h2hCol}60`:"none"}}>ROUND {r}</span>
        {done.length<rGames.length&&<Pill label={done.length+"/"+rGames.length+" done"} col="#FFC300"/>}
      </div>
      {/* Right: H2H % + Double % + chevron */}
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        {/* H2H accuracy */}
        {h2hPct!=null&&<div style={{textAlign:"center"}}>
          <div style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.1em",marginBottom:2}}>H2H</div>
          <div style={{...BD,fontSize:28,color:h2hCol,textShadow:`0 0 16px ${h2hCol}50`,lineHeight:1}}>{h2hPct}%</div>
          <div style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.04em"}}>{tipped}/{done.length}</div>
        </div>}
        {/* Divider */}
        {h2hPct!=null&&dblPct!=null&&<div style={{width:1,height:36,background:"#1C2D48"}}/>}
        {/* Double accuracy */}
        {dblPct!=null&&<div style={{textAlign:"center"}}>
          <div style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.1em",marginBottom:2}}>DOUBLE</div>
          <div style={{...BD,fontSize:28,color:dblCol,textShadow:`0 0 16px ${dblCol}50`,lineHeight:1}}>{dblPct}%</div>
          <div style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.04em"}}>{dblC}/{dblT}</div>
        </div>}
        <span style={{...M,fontSize:10,color:open?borderCol:"#3D5878",transition:"color .2s",marginLeft:4}}>{open?"▲":"▼"}</span>
      </div>
    </button>
    {open&&<div className="fade">
      <div style={{borderTop:"1px solid #1C2D4840"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 58px 1fr 20px 48px 80px",gap:4,padding:"6px 14px",...M,fontSize:9,color:"#3D5878",letterSpacing:"0.08em"}}>
          <span>HOME</span><span style={{textAlign:"center"}}>RESULT</span><span style={{textAlign:"right"}}>AWAY</span><span style={{textAlign:"center"}}>H2H</span><span style={{textAlign:"right"}}>PROJ</span><span style={{textAlign:"center",color:"#FFC300"}}>H2H O/U DBL</span>
        </div>
        {rGames.map((g,i)=>{
          const tip       = (rAna[mk(g.hteam,g.ateam)]||{}).tip;
          const correct   = tip&&g.complete===100&&tip===g.winner;
          const wrong     = tip&&g.complete===100&&tip!==g.winner;
          const total     = g.complete===100&&g.hscore!=null&&g.ascore!=null?(g.hscore+g.ascore):null;
          const p         = projTotal(g.hteam,g.ateam,g.venue||"",0,[],[],[],[],sc);
          const diff      = p&&total?(p-total).toFixed(0):null;
          const hcol      = TC[g.hteam]||"#334155";
          const acol      = TC[g.ateam]||"#334155";
          const ouLine      = (MANUAL_DATA[r]?.ouLines||{})[mk(g.hteam,g.ateam)]||null;
          const ouTip       = p&&ouLine?(p>ouLine?"OVER":"UNDER"):null;
          const ouActual    = total&&ouLine?(total>ouLine?"OVER":"UNDER"):null;
          const ouCorrect   = ouTip&&ouActual&&ouTip===ouActual;
          // Double = H2H tip correct AND O/U tip correct
          const h2hTip      = (MANUAL_DATA[r]?.analysis||{})[mk(g.hteam,g.ateam)]?.tip||null;
          const h2hCorrect  = h2hTip&&g.complete===100&&h2hTip===g.winner;
          const doubleCorrect = h2hCorrect&&ouCorrect;
          const doubleWrong   = g.complete===100&&ouLine&&h2hTip&&!(doubleCorrect);
          const doubleLabel   = h2hTip&&ouTip&&ouLine ? `${ABBR[h2hTip]||h2hTip} + ${ouTip==="OVER"?"OVR":"UND"} ${ouLine}` : null;
          return(<div key={i} className="row" style={{padding:"7px 14px",borderBottom:"1px solid #080D1A",transition:"background .15s"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 58px 1fr 20px 48px 80px",gap:4,alignItems:"center"}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:3,height:26,background:hcol,borderRadius:2,flexShrink:0,boxShadow:`0 0 6px ${hcol}60`}}/>
                <div>
                  <div style={{...M,fontSize:11,fontWeight:700,color:g.complete===100&&g.winner===g.hteam?"#EEF3FF":"#3D5878"}}>{ABBR[g.hteam]||g.hteam}</div>
                  {tip===g.hteam&&<div style={{...M,fontSize:8,color:"#CAFF00"}}>★ tipped</div>}
                </div>
              </div>
              <div style={{textAlign:"center"}}>
                {g.complete===100
                  ?<><div style={{...M,fontSize:11,fontWeight:700,color:wrong?"#FF3D3D":"#3D5878"}}>{g.margin!=null?"+"+g.margin:"?"}</div>
                    <div style={{...M,fontSize:9,color:"#3D5878"}}>{total}pts</div></>
                  :<div style={{...M,fontSize:9,color:"#3D5878"}}>upcoming</div>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6,justifyContent:"flex-end"}}>
                <div style={{textAlign:"right"}}>
                  <div style={{...M,fontSize:11,fontWeight:700,color:g.complete===100&&g.winner===g.ateam?"#EEF3FF":"#3D5878"}}>{ABBR[g.ateam]||g.ateam}</div>
                  {tip===g.ateam&&<div style={{...M,fontSize:8,color:"#CAFF00",textAlign:"right"}}>★ tipped</div>}
                </div>
                <div style={{width:3,height:26,background:acol,borderRadius:2,flexShrink:0,boxShadow:`0 0 6px ${acol}60`}}/>
              </div>
              <div style={{textAlign:"center",...BD,fontSize:16,color:correct?"#CAFF00":wrong?"#FF3D3D":"#3D5878",textShadow:correct?"0 0 10px #CAFF0060":wrong?"0 0 10px #FF3D3D60":"none"}}>
                {g.complete===100?(correct?"✓":wrong?"✗":"·"):"·"}
              </div>
              <div style={{textAlign:"right"}}>
                {diff!=null&&<>
                  <div style={{...M,fontSize:9,color:"#3D5878"}}>proj {p}</div>
                  <div style={{...M,fontSize:9,color:Math.abs(+diff)>25?"#FFC300":"#3D5878"}}>{+diff>=0?"+":""}{diff}</div>
                </>}
              </div>
              {/* H2H O/U Double result cell */}
              <div style={{textAlign:"center"}}>
                {doubleLabel?(
                  <div style={{display:"inline-flex",flexDirection:"column",alignItems:"center",gap:1}}>
                    <span style={{...M,fontSize:9,fontWeight:700,letterSpacing:"0.03em",
                      color:doubleCorrect?"#CAFF00":doubleWrong?"#FF3D3D":"#FFC300",
                      background:(doubleCorrect?"#CAFF00":doubleWrong?"#FF3D3D":"#FFC300")+"15",
                      border:`1px solid ${doubleCorrect?"#CAFF00":doubleWrong?"#FF3D3D":"#FFC300"}30`,
                      padding:"2px 6px",borderRadius:20,lineHeight:1.3,
                      textShadow:doubleCorrect?"0 0 8px #CAFF0060":doubleWrong?"0 0 8px #FF3D3D50":"none"}}>
                      {doubleLabel}
                    </span>
                    {g.complete===100&&ouLine&&(
                      <span style={{...M,fontSize:12,
                        color:doubleCorrect?"#CAFF00":doubleWrong?"#FF3D3D":"#3D5878",
                        textShadow:doubleCorrect?"0 0 10px #CAFF0060":doubleWrong?"0 0 10px #FF3D3D60":"none"}}>
                        {doubleCorrect?"✓":doubleWrong?"✗":""}
                      </span>
                    )}
                    {g.complete<100&&ouLine&&<span style={{...M,fontSize:8,color:"#3D5878"}}>upcoming</span>}
                    {!ouLine&&<span style={{...M,fontSize:8,color:"#1C2D48"}}>no line</span>}
                  </div>
                ):(
                  <span style={{...M,fontSize:9,color:"#1C2D48"}}>—</span>
                )}
              </div>
            </div>
          </div>);
        })}
      </div>
    </div>}
  </div>);
};

/* ── Main App ──────────────────────────────────────────────────────── */
function App() {
  const [tab,setTab]           = useState("tips");
  const [showSettings,setShowSettings] = useState(false);
  const [selRound,setSelRound] = useState(null);

  /* Squiggle state */
  const [allGames,setAllGames]   = useState(()=>ls.get("afl_sq_games",STATIC_GAMES));
  const [sqLoading,setSqLoading] = useState(false);
  const [sqErr,setSqErr]         = useState(null);
  const [sqTime,setSqTime]       = useState(()=>ls.get("afl_sq_time",null));
  const [sqTips,setSqTips]       = useState({});

  /* Odds API state */
  const [oddsKey,setOddsKey]     = useState(()=>ls.get("afl_odds_key",""));
  const [oddsData,setOddsData]   = useState(()=>ls.get("afl_odds_data",null));
  const [oddsLoading,setOddsLoading] = useState(false);
  const [oddsErr,setOddsErr]     = useState(null);
  const [lastOdds,setLastOdds]   = useState(()=>ls.get("afl_odds_time",null));

  /* Derived */
  const sc = useMemo(() => allGames.length>0 ? calcRollingSC(allGames) : SEASON_BASE, [allGames]);

  const currentRound = useMemo(() => {
    if (allGames.length===0) return 10;
    const max = Math.max(...allGames.map(g=>g.round||0));
    for (let r=max; r>=1; r--) {
      const rg = allGames.filter(g=>g.round===r);
      if (rg.length>0 && rg.some(g=>g.complete<100)) return r;
    }
    return max;
  }, [allGames]);

  const round = selRound || currentRound;

  const roundGames = useMemo(() =>
    allGames.filter(g=>g.round===round).sort((a,b)=>a.date<b.date?-1:1)
  , [allGames,round]);

  const allRounds = useMemo(() => {
    const rs = new Set(allGames.map(g=>g.round));
    return [...rs].sort((a,b)=>b-a);
  }, [allGames]);

  /* Squiggle fetch */
  const fetchSquiggle = useCallback(async () => {
    setSqLoading(true); setSqErr(null);
    try {
      const games = await fetchSquiggleGames(2026);
      setAllGames(games);
      ls.set("afl_sq_games", games);
      const t = new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});
      ls.set("afl_sq_time", t); setSqTime(t);
    } catch(e) { setSqErr(e.message); }
    setSqLoading(false);
  }, []);

  const fetchTipsForRound = useCallback(async (r) => {
    try {
      const tips = await fetchSquiggleTips(2026, r);
      const m = {};
      tips.forEach(t => { m[mk(t.hteam,t.ateam)] = t; });
      setSqTips(m);
    } catch(e) {}
  }, []);

  /* Odds fetch */
  const fetchOdds = useCallback(async (key=oddsKey) => {
    if (!key) return;
    setOddsLoading(true); setOddsErr(null);
    try {
      const data = await fetchOddsAPI(key);
      setOddsData(data); ls.set("afl_odds_data", data);
      const t = new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});
      setLastOdds(t); ls.set("afl_odds_time", t);
    } catch(e) { setOddsErr(e.message); }
    setOddsLoading(false);
  }, [oddsKey]);

  const saveOddsKey = useCallback((k) => {
    if (!k) return;
    setOddsKey(k); ls.set("afl_odds_key", k);
    setShowSettings(false);
    fetchOdds(k);
  }, [fetchOdds]);

  /* On mount: fetch Squiggle if stale */
  useEffect(() => {
    const last = ls.get("afl_sq_time", null);
    const stale = !last || (Date.now()-new Date("2026-01-01T"+last+":00").getTime()) > 3600000;
    if (stale || allGames.length===0) fetchSquiggle();
  }, []);

  /* Fetch tips when round changes */
  useEffect(() => { if(round) fetchTipsForRound(round); }, [round]);

  /* Auto-fetch odds on mount if key exists */
  useEffect(() => { if(oddsKey) fetchOdds(oddsKey); }, []);

  /* Stats */
  const completed = allGames.filter(g=>g.complete===100);
  const oddsOn = !!oddsData && Object.keys(oddsData).length>0;

  /* Round tips at-a-glance */
  const glanceTips = roundGames.map(g => {
    const key = mk(g.hteam,g.ateam);
    return (MANUAL_DATA[round]?.analysis||{})[key]?.tip || null;
  });

  return(<div style={{minHeight:"100vh",background:"#05080F"}}>
    {/* ── Header ── */}
    <div style={{background:"linear-gradient(160deg,#0E1B38 0%,#0A1228 40%,#05080F 100%)",borderBottom:"1px solid #1C2D4860",padding:"20px 14px 16px",textAlign:"center",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",top:-40,left:"15%",width:200,height:200,borderRadius:"50%",background:"radial-gradient(circle,#CAFF0015 0%,transparent 70%)",pointerEvents:"none"}}/>
      <div style={{position:"absolute",top:-40,right:"15%",width:160,height:160,borderRadius:"50%",background:"radial-gradient(circle,#00E5FF10 0%,transparent 70%)",pointerEvents:"none"}}/>
      <div style={{...BD,fontSize:48,letterSpacing:"0.12em",lineHeight:1,background:"linear-gradient(135deg,#CAFF00,#00E5FF)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>AFL TIPPER 2026</div>
      <div style={{...M,fontSize:10,color:"#3D5878",letterSpacing:"0.18em",marginTop:4}}>AUTOMATED · SQUIGGLE + THE ODDS API · 6 IMPROVEMENTS ACTIVE</div>
      <div style={{display:"flex",gap:5,justifyContent:"center",flexWrap:"wrap",marginTop:10}}>
        <button onClick={fetchSquiggle} disabled={sqLoading} style={{display:"flex",alignItems:"center",gap:6,...M,
          background:sqTime?"#CAFF0012":"#0C1525",border:`1px solid ${sqErr?"#FF3D3D50":sqTime?"#CAFF0050":"#1C2D48"}`,
          color:sqErr?"#FF3D3D":sqTime?"#CAFF00":"#3D5878",
          padding:"5px 14px",borderRadius:20,fontSize:10,letterSpacing:"0.08em",
          boxShadow:sqTime?"0 0 16px #CAFF0020":"none",fontWeight:600}}>
          {sqLoading?<><Spinner size={9}/>SYNCING</>:sqErr?"⚠ SQUIGGLE":sqTime?"◉ SQUIGGLE":"◌ SQUIGGLE"}
        </button>
        <button onClick={()=>oddsKey?fetchOdds():setShowSettings(true)} style={{display:"flex",alignItems:"center",gap:6,...M,
          background:oddsOn?"#FF3D3D12":"#0C1525",border:`1px solid ${oddsOn?"#FF3D3D50":oddsErr?"#FF3D3D50":"#1C2D48"}`,
          color:oddsOn?"#FF5555":oddsErr?"#FF3D3D":oddsLoading?"#FFC300":"#3D5878",
          padding:"5px 14px",borderRadius:20,fontSize:10,letterSpacing:"0.08em",
          boxShadow:oddsOn?"0 0 16px #FF3D3D20":"none",fontWeight:600}}>
          {oddsLoading?<><Spinner size={9} col="#FF5555"/>LOADING</>:oddsOn?"● TAB LIVE":oddsErr?"⚠ ODDS ERR":"○ ADD TAB ODDS KEY"}
        </button>
        <button onClick={()=>setShowSettings(s=>!s)} style={{...M,
          background:showSettings?"#00E5FF15":"#0C1525",border:`1px solid ${showSettings?"#00E5FF50":"#1C2D48"}`,color:showSettings?"#00E5FF":"#3D5878",
          padding:"5px 14px",borderRadius:20,fontSize:10,letterSpacing:"0.08em",fontWeight:600}}>
          ⚙ SETTINGS
        </button>
      </div>
    </div>

    <div style={{maxWidth:720,margin:"0 auto",padding:"10px 14px 0"}}>
      {/* Settings */}
      {showSettings&&<Settings oddsKey={oddsKey} onSave={saveOddsKey} onRefreshOdds={()=>fetchOdds()} oddsLoading={oddsLoading} lastOdds={lastOdds} oddsErr={oddsErr} onClose={()=>setShowSettings(false)}/>}

      {/* Squiggle error */}
      {sqErr&&!sqLoading&&<div style={{...S,background:"#080D1A",border:"1px solid #FF3D3D40",borderRadius:8,padding:"10px 12px",marginBottom:10,fontSize:11,color:"#FFC300"}}>
        {location.protocol==="https:"
          ? `📊 Squiggle sync failed: ${sqErr}. Using embedded data.`
          : "📊 Local file — Squiggle needs HTTPS. Using embedded data."
        } <button onClick={fetchSquiggle} style={{color:"#00E5FF",textDecoration:"underline",marginLeft:4}}>Retry</button>
      </div>}

      {/* Tabs */}
      <div style={{display:"flex",gap:6,marginBottom:12,padding:"3px",background:"#08111F",borderRadius:14,border:"1px solid #1C2D48"}}>
        {[["tips","🏉 ROUND "+round],["retro","📊 RETROSPECTIVE"]].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"10px 0",borderRadius:11,...M,fontSize:11,fontWeight:700,letterSpacing:"0.08em",
            background:tab===k?"linear-gradient(135deg,#CAFF00,#80FF00)":"transparent",
            color:tab===k?"#000":"#3D5878",border:"none",
            boxShadow:tab===k?"0 0 20px #CAFF0040":"none",
            transition:"all .2s"}}>{l}</button>
        ))}
      </div>

      {/* ── TIPS ── */}
      {tab==="tips"&&<>
        {/* Round selector */}
        {allRounds.length>0&&<div style={{display:"flex",gap:5,alignItems:"center",marginBottom:10,flexWrap:"wrap"}}>
          <span style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.06em"}}>ROUND</span>
          {[...Array(Math.max(...allRounds))].map((_,i)=>{
            const r=i+1;
            if (!allRounds.includes(r)&&r!==currentRound) return null;
            return(<button key={r} onClick={()=>setSelRound(r)} style={{...M,fontSize:10,padding:"2px 8px",borderRadius:5,background:round===r?"#1C2D48":"transparent",color:round===r?"#EAF0FF":r===currentRound?"#7A96BA":"#3D5878",border:round===r?"1px solid #253C5F":"1px solid transparent",fontWeight:r===currentRound?700:400}}>{r}</button>);
          })}
          {sqLoading&&<Spinner size={10}/>}
        </div>}

        {/* Data status banner */}
        <div style={{background:"#080D1A",border:"1px solid #1C2D48",borderRadius:10,padding:"10px 14px",marginBottom:10}}>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
            <Pill label={sqTime?"◉ SQUIGGLE "+sqTime:"◌ SQUIGGLE"} col={sqTime?"#CAFF00":"#3D5878"}/>
            <Pill label={sc["Sydney"]?.n?`${sc["Sydney"].n}G ROLLING SC`:"SEASON AVG SC"} col="#00E5FF"/>
            <Pill label={oddsOn?"● TAB LIVE":"○ NO ODDS"} col={oddsOn?"#FF5555":"#3D5878"}/>
            {!oddsOn&&!oddsLoading&&<span style={{...M,fontSize:9,color:"#FFC300",letterSpacing:"0.06em"}}>+ ADD ODDS KEY IN SETTINGS</span>}
          </div>
        </div>

                {/* Tips summary table */}
        {roundGames.length>0&&<div style={{background:"#08111F",border:"1px solid #1C2D48",borderRadius:14,padding:"14px 16px",marginBottom:12}}>
          <div style={{...BD,fontSize:22,color:"#EAF0FF",letterSpacing:"0.12em",marginBottom:12}}>ROUND {round} · TIPS SUMMARY</div>
          {/* Column headers */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 76px 1fr",gap:8,marginBottom:4,padding:"0 2px"}}>
            <span style={{...M,fontSize:9,color:"#3D5878",letterSpacing:"0.1em"}}>GAME</span>
            <span style={{...M,fontSize:9,color:"#CAFF00",letterSpacing:"0.1em",textAlign:"center"}}>H2H TIP</span>
            <span style={{...M,fontSize:9,color:"#FFC300",letterSpacing:"0.1em",textAlign:"right"}}>H2H O/U DOUBLE</span>
          </div>
          {roundGames.map((g,i)=>{
            const key    = mk(g.hteam,g.ateam);
            const rAna   = (MANUAL_DATA[round]?.analysis||{})[key]||null;
            const tip    = rAna?.tip||null;
            const ouLine = (MANUAL_DATA[round]?.ouLines||{})[key]||null;
            const wx     = (MANUAL_DATA[round]?.weather||{})[key]||{adj:0};
            const hSq    = (MANUAL_DATA[round]?.squads||{})[g.hteam]||{ins:[],outs:[]};
            const aSq    = (MANUAL_DATA[round]?.squads||{})[g.ateam]||{ins:[],outs:[]};
            const p      = projTotal(g.hteam,g.ateam,g.venue||"",wx.adj,hSq.ins,hSq.outs,aSq.ins,aSq.outs,sc);
            const ouTip  = p&&ouLine?(p>ouLine?"OVR":"UND"):null;
            const tipCol = TC[tip]||"#3D5878";
            const done   = g.complete===100;
            const h2hOk  = done&&tip&&g.winner===tip;
            const h2hNo  = done&&tip&&g.winner!==tip;
            const dblOk  = done&&ouLine&&ouTip&&(()=>{const ouAct=(g.hscore+g.ascore)>ouLine?"OVR":"UND";return h2hOk&&ouTip===ouAct;})();
            const dblNo  = done&&ouLine&&ouTip&&!dblOk;
            return(<div key={i} style={{display:"grid",gridTemplateColumns:"1fr 76px 1fr",gap:8,
              padding:"8px 2px",borderTop:"1px solid #1C2D4840",alignItems:"center"}}>
              {/* Game */}
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:2,height:18,background:TC[g.hteam]||"#334155",borderRadius:1,flexShrink:0}}/>
                <span style={{...M,fontSize:10,color:"#7A96BA"}}>
                  {ABBR[g.hteam]} <span style={{color:"#3D5878",fontSize:8}}>v</span> {ABBR[g.ateam]}
                </span>
                {done&&<span style={{...M,fontSize:8,color:"#3D5878",marginLeft:2}}>{g.hscore}-{g.ascore}</span>}
              </div>
              {/* H2H tip */}
              <div style={{textAlign:"center"}}>
                {tip?(
                  <span style={{...M,fontSize:11,fontWeight:700,
                    color:h2hOk?"#CAFF00":h2hNo?"#FF3D3D":tipCol,
                    background:(h2hOk?"#CAFF00":h2hNo?"#FF3D3D":tipCol)+"18",
                    border:`1px solid ${h2hOk?"#CAFF00":h2hNo?"#FF3D3D":tipCol}40`,
                    padding:"2px 8px",borderRadius:20,
                    textShadow:h2hOk?"0 0 10px #CAFF0060":h2hNo?"0 0 10px #FF3D3D50":"none"}}>
                    {ABBR[tip]||tip}{h2hOk?" ✓":h2hNo?" ✗":""}
                  </span>
                ):<span style={{...M,fontSize:9,color:"#3D5878"}}>—</span>}
              </div>
              {/* Double */}
              <div style={{textAlign:"right"}}>
                {tip&&ouTip&&ouLine?(
                  <span style={{...M,fontSize:10,fontWeight:600,letterSpacing:"0.02em",
                    color:dblOk?"#CAFF00":dblNo?"#FF3D3D":"#FFC300",
                    background:(dblOk?"#CAFF00":dblNo?"#FF3D3D":"#FFC300")+"15",
                    border:`1px solid ${dblOk?"#CAFF00":dblNo?"#FF3D3D":"#FFC300"}40`,
                    padding:"2px 8px",borderRadius:20,
                    textShadow:dblOk?"0 0 10px #CAFF0060":dblNo?"0 0 10px #FF3D3D50":"none"}}>
                    {ABBR[tip]} + {ouTip} {ouLine}{dblOk?" ✓":dblNo?" ✗":""}
                  </span>
                ):<span style={{...M,fontSize:9,color:"#3D5878"}}>—</span>}
              </div>
            </div>);
          })}
        </div>}

        {/* No data */}
        {roundGames.length===0&&!sqLoading&&<div style={{textAlign:"center",padding:"40px 20px"}}>
          <div style={{...M,fontSize:14,color:"#3D5878",marginBottom:8}}>No fixture data for Round {round}</div>
          <button onClick={fetchSquiggle} style={{...M,background:"#CAFF00",color:"#000",padding:"8px 16px",borderRadius:8,fontWeight:700,fontSize:11}}>↻ FETCH FROM SQUIGGLE</button>
        </div>}
        {sqLoading&&roundGames.length===0&&<div style={{textAlign:"center",padding:"40px"}}><Spinner size={24}/><div style={{...M,fontSize:11,color:"#3D5878",marginTop:12}}>Loading from Squiggle...</div></div>}

        {/* Game cards */}
        {roundGames.map((g,i)=>(
          <GameCard key={i} game={g} round={round} sc={sc} oddsData={oddsData} sqTip={sqTips[mk(g.hteam,g.ateam)]}/>
        ))}

        {roundGames.length>0&&<div style={{textAlign:"center",marginTop:12,...M,fontSize:9,color:"#3D5878",letterSpacing:"0.04em"}}>
          FIXTURES & RESULTS: SQUIGGLE API · ODDS: TAB (via The Odds API) · SQUAD NEWS: MANUAL UPDATE EACH ROUND
        </div>}
      </>}

      {/* ── RETROSPECTIVE ── */}
      {tab==="retro"&&<>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
          {(()=>{
            // H2H accuracy across all rounds with tips
            let h2hT=0,h2hC=0,dblT=0,dblC=0;
            allRounds.forEach(r=>{
              const rAna=MANUAL_DATA[r]?.analysis||{};
              const rLines=MANUAL_DATA[r]?.ouLines||{};
              allGames.filter(g=>g.round===r&&g.complete===100&&g.hscore!=null).forEach(g=>{
                const key=mk(g.hteam,g.ateam);
                const h2hTip=rAna[key]?.tip;
                if(h2hTip){h2hT++;if(h2hTip===g.winner)h2hC++;}
                const line=rLines[key];
                if(h2hTip&&line){
                  const sc2=allGames.length>0?calcRollingSC(allGames):SEASON_BASE;
                  const p=projTotal(g.hteam,g.ateam,g.venue||"",0,[],[],[],[],sc2);
                  const ouTip=p&&p>line?"OVER":"UNDER";
                  const ouAct=(g.hscore+g.ascore)>line?"OVER":"UNDER";
                  dblT++;if(h2hTip===g.winner&&ouTip===ouAct)dblC++;
                }
              });
            });
            const h2hPct  = h2hT>0?Math.round(h2hC/h2hT*100):null;
            const dblPct  = dblT>0?Math.round(dblC/dblT*100):null;
            const avgTotal= completed.length?Math.round(completed.reduce((s,g)=>s+(g.hscore||0)+(g.ascore||0),0)/completed.length):null;
            return [
              {label:"H2H ACCURACY",   value:h2hPct!=null?h2hPct+"%":"—",  sub:`${h2hC} of ${h2hT} correct`,  col:h2hPct==null?"#3D5878":h2hPct>=75?"#CAFF00":h2hPct>=60?"#FFC300":"#FF3D3D"},
              {label:"DOUBLE ACCURACY",value:dblPct!=null?dblPct+"%":"—",  sub:`${dblC} of ${dblT} correct`,  col:dblPct==null?"#3D5878":dblPct>=60?"#CAFF00":dblPct>=45?"#FFC300":"#FF3D3D"},
              {label:"GAMES COMPLETE", value:completed.length,              sub:`${allRounds.length} rounds`,   col:"#00E5FF"},
              {label:"AVG TOTAL",      value:avgTotal!=null?avgTotal+"pts":"—",sub:"per game",                col:"#7A96BA"},
            ];
          })().map(({label,value,sub,col})=>(
            <div key={label} style={{background:`linear-gradient(135deg,${col}12,${col}05)`,border:`1px solid ${col}30`,borderRadius:12,padding:"12px 14px",flex:1,minWidth:80,boxShadow:`0 0 20px ${col}10`}}>
              <div style={{...M,fontSize:8,color:"#3D5878",letterSpacing:"0.1em",marginBottom:5}}>{label}</div>
              <div style={{...BD,fontSize:28,color:col,lineHeight:1,textShadow:`0 0 20px ${col}50`}}>{value}</div>
              <div style={{...S,fontSize:9,color:"#3D5878",marginTop:3}}>{sub}</div>
            </div>
          ))}
        </div>

        <div style={{background:"#080D1A",border:"1px solid #CAFF0030",borderRadius:10,padding:"10px 14px",marginBottom:12}}>
          <div style={{...M,fontSize:10,color:"#CAFF00",letterSpacing:"0.08em",marginBottom:4}}>🔄 FULLY AUTOMATED</div>
          <div style={{...S,fontSize:11,color:"#3D5878",lineHeight:1.6}}>
            Results and scores fetched from Squiggle API automatically on each load. Rolling SC averages update as results come in. No manual data entry needed for results.
            {sqTime&&<span style={{color:"#CAFF00"}}> Last sync: {sqTime}</span>}
          </div>
        </div>

        {allRounds.length===0&&!sqLoading&&<div style={{textAlign:"center",padding:"40px"}}>
          <button onClick={fetchSquiggle} style={{...M,background:"#CAFF00",color:"#000",padding:"8px 16px",borderRadius:8,fontWeight:700,fontSize:11}}>↻ FETCH FROM SQUIGGLE</button>
        </div>}
        {sqLoading&&<div style={{textAlign:"center",padding:"40px"}}><Spinner size={24}/><div style={{...M,fontSize:11,color:"#3D5878",marginTop:12}}>Loading results...</div></div>}

        {allRounds.map(r => (
          <RetroRoundCard key={r} r={r} allGames={allGames} sc={sc} currentRound={currentRound}/>
        ))}
      </>}

      <div style={{height:48}}/>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
